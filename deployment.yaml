apiVersion: apps/v1
kind: Deployment
metadata:
  name: machinefailure
  labels:
    app: machinefailure
spec:
  replicas: 2
  selector:
    matchLabels:
      app: machinefailure
  template:
    metadata:
      labels:
        app: machinefailure
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: machinefailure
          image: emmaprime/machinefailure_ml:v1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: machinefailure
  labels:
    app: machinefailure
spec:
  type: ClusterIP
  selector:
    app: machinefailure
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP